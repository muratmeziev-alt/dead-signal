<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEAD SIGNAL · Media and News</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=Chakra+Petch:wght@600;700&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060404}
@keyframes dsm-blink{0%,55%{opacity:1}56%,100%{opacity:.2}}
.dsm-blink{animation:dsm-blink 1.4s steps(1) infinite}
.dsm-thumb img{transition:transform .5s,filter .25s}
.dsm-thumb:hover img{transform:scale(1.03);filter:brightness(1.1)}
.dsm-cap{opacity:0;transition:opacity .25s}
.dsm-thumb:hover .dsm-cap,.dsm-thumb:focus-visible .dsm-cap{opacity:1}
.dsm-row{transition:background .25s}
.dsm-row:hover{background:rgb(229 48 58 / .05)}
.dsm-row .dsm-go{transition:transform .25s,color .25s}
.dsm-row:hover .dsm-go{transform:translate(3px,-3px);color:#ff4f57}
@media (prefers-reduced-motion: reduce){.dsm-blink{animation:none}}
.ds-bf,.ds-bo,.ds-bt,.ds-bo2,.ds-bo2>span,.ds-bo2>span>span{transition:background-color .2s,color .2s,box-shadow .2s}
.ds-bf:hover,.ds-bf:focus-visible{background-color:#c4252e !important;color:#120607 !important}
.ds-bo:hover,.ds-bo:focus-visible{background-color:#e5303a !important;color:#120607 !important;box-shadow:inset 0 0 0 1px #e5303a !important;text-shadow:none !important}
.ds-bt:not([aria-pressed="true"]):hover{background-color:rgb(229 48 58 / .22) !important;box-shadow:inset 0 0 0 1px #e5303a !important;color:#ffffff !important}
.ds-bo2:hover,.ds-bo2:focus-visible{color:#120607 !important}.ds-bo2:hover>span:first-child,.ds-bo2:hover>span:first-child>span{background-color:#e5303a !important}
@media (max-width:1099px){
.dsm-wrap{gap:120px !important}
.dsm-gal{grid-template-columns:repeat(4,minmax(0,1fr)) !important;gap:16px !important}
.dsm-gal>*{grid-column:auto !important;grid-row:auto !important;align-self:start !important}
.dsm-gal>.dsm-intro{grid-column:1 / -1 !important;flex-direction:row !important;align-items:flex-end !important;margin-bottom:8px}
.dsm-news{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
.dsm-news>:nth-child(1){grid-column:span 1 !important}
.dsm-news>:nth-child(2){grid-column:span 2 !important}
.dsm-news>:nth-child(3){grid-column:span 1 !important}
.dsm-title{font-size:28px !important}
}
@media (max-width:699px){
.dsm-wrap{gap:96px !important}
.dsm-gal{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:12px !important}
.dsm-news{grid-template-columns:minmax(0,1fr) !important;gap:16px !important;padding:24px 0 !important}
.dsm-news>:nth-child(1){grid-column:1 !important;grid-row:1;flex-direction:row !important;align-items:center !important}
.dsm-news>:nth-child(3){grid-column:1 !important;grid-row:2;aspect-ratio:16 / 9 !important}
.dsm-news>:nth-child(2){grid-column:1 !important;grid-row:3}
.dsm-title{font-size:24px !important}
.dsm-title svg{display:none}
.dsm-lbbar{flex-wrap:wrap}
.dsm-lb{padding:24px 12px !important}
}
</style>
</helmet>
<div style="width: 100%; background: #060404; color: #ece8e1; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
<div class="dsm-wrap" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 0 clamp(20px, 4vw, 56px); display: flex; flex-direction: column; gap: 180px">

<section id="media" style="display: flex; flex-direction: column; gap: 32px">

<div class="dsm-gal" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 24px; align-items: start">
<div class="dsm-intro" style="grid-column: 1 / span 1; grid-row: 1; align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .12em"><span style="padding: 3px 7px; background: #e5303a; color: #120607">MEDIA</span><span style="color: rgb(236 232 225 / .55)">GALLERY · {{count}} FRAMES</span></span>
<a href="#press" class="dsm-btn ds-bo2" style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 48px; padding: 0 16px; font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: .12em; color: #ece8e1; text-decoration: none; white-space: nowrap">
<span aria-hidden="true" style="position: absolute; inset: 0; background: rgb(229 48 58 / .6); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%)"><span style="position: absolute; inset: 1px; background: #060404; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9.6px), calc(100% - 9.6px) 100%, 0 100%)"></span></span>
<span style="position: relative">PRESS KIT</span><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" style="position: relative; width: 13px; height: 13px"><path d="M8 2v11M4 9l4 4 4-4"></path></svg></a>
</div>
<sc-for list="{{shots}}" as="s" hint-placeholder-count="8">
<button type="button" class="dsm-thumb" aria-label="Open image: {{s.title}}" onClick="{{s.open}}" style="grid-column: {{s.col}}; grid-row: {{s.row}}; align-self: {{s.align}}; position: relative; aspect-ratio: 4 / 5; padding: 0; border: 0; overflow: hidden; background: #0c0405; cursor: zoom-in">
<img src="{{s.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{s.pos}}">
<span class="dsm-cap" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 12px; padding: 28px 14px 12px; background: linear-gradient(180deg, rgb(6 4 4 / 0), rgb(6 4 4 / .85)); font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: .08em; color: #ece8e1; text-align: left"><span>{{s.title}}</span><span style="color: rgb(236 232 225 / .55)">{{s.num}}</span></span>
</button>
</sc-for>
</div>

<sc-if value="{{box.open}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{box.title}}" class="dsm-lb" style="position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 48px 24px; box-sizing: border-box; background: rgb(6 4 4 / .94)">
<div style="position: relative; max-width: min(1200px, 100%); max-height: calc(100vh - 160px); aspect-ratio: 16 / 9; width: 100%; padding: 1px; box-sizing: border-box; background: rgb(229 48 58 / .4); clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px)">
<div style="position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0405; clip-path: polygon(23.6px 0, 100% 0, 100% calc(100% - 23.6px), calc(100% - 23.6px) 100%, 0 100%, 0 23.6px)">
<img src="{{box.img}}" alt="{{box.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{box.pos}}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(0 0 0 / .16) 0 1px, transparent 1px 3px)"></div>
<div style="position: absolute; top: 20px; left: 40px; display: inline-flex; align-items: center; gap: 8px; font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .14em; color: rgb(236 232 225 / .8)"><span aria-hidden="true" class="dsm-blink" style="width: 8px; height: 8px; background: #e5303a"></span>REC · IMG {{box.num}} / {{count}}</div>
</div>
</div>
<div class="dsm-lbbar" style="width: min(1200px, 100%); display: flex; align-items: center; justify-content: space-between; gap: 16px; font-family: 'Share Tech Mono', ui-monospace, monospace">
<span style="font-size: 18px; letter-spacing: .08em; color: #ece8e1">{{box.title}}<span style="margin-left: 14px; font-size: 12px; letter-spacing: .14em; color: rgb(236 232 225 / .55)">{{box.place}}</span></span>
<span style="display: flex; gap: 8px">
<button type="button" aria-label="Previous image" class="ds-bo" onClick="{{prev}}" style="{{ctl}}">‹</button>
<button type="button" aria-label="Next image" class="ds-bo" onClick="{{next}}" style="{{ctl}}">›</button>
<button type="button" aria-label="Close" class="ds-bo" onClick="{{close}}" style="{{ctl}}">✕</button>
</span>
</div>
</div>
</sc-if>
</section>

<section id="news" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px">
<span style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .12em"><span style="padding: 3px 7px; background: #e5303a; color: #120607">NEWS</span><span style="color: rgb(236 232 225 / .55)">TRANSMISSIONS</span></span>
<a href="https://x.com/DeadSignalHQ" class="dsm-btn ds-bf" style="display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 18px; background: #e5303a; color: #120607; font-family: 'Chakra Petch', ui-monospace, monospace; font-weight: 700; font-size: 15px; letter-spacing: .1em; text-decoration: none; white-space: nowrap; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%)">FOLLOW @DEADSIGNALHQ<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" style="width: 12px; height: 12px"><path d="M4 12L12 4M6 4h6v6"></path></svg></a>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid rgb(229 48 58 / .3)">
<sc-for list="{{news}}" as="n" hint-placeholder-count="4">
<a href="https://x.com/DeadSignalHQ" class="dsm-row dsm-news" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 24px; align-items: center; padding: 24px 0; border-bottom: 1px solid rgb(229 48 58 / .3); color: inherit; text-decoration: none">
<div style="grid-column: span 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font-family: 'Share Tech Mono', ui-monospace, monospace; letter-spacing: .12em">
<span style="font-size: 14px; color: rgb(236 232 225 / .7)">{{n.date}}</span>
<span style="padding: 3px 7px; font-size: 11px; box-shadow: inset 0 0 0 1px rgb(229 48 58 / .6); color: #ff6b72">{{n.tag}}</span>
</div>
<div style="grid-column: span 4; display: flex; flex-direction: column; gap: 10px">
<span class="dsm-title" style="display: flex; align-items: flex-start; gap: 12px; font-family: 'Big Shoulders Display', 'Big Shoulders', Impact, sans-serif; font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: .01em">{{n.title}}<svg class="dsm-go" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" style="flex: none; width: 14px; height: 14px; margin-top: 4px; color: rgb(236 232 225 / .4)"><path d="M4 12L12 4M6 4h6v6"></path></svg></span>
<span style="max-width: 620px; font-size: 16px; line-height: 1.5; color: rgb(236 232 225 / .66); text-wrap: pretty">{{n.text}}</span>
</div>
<div style="grid-column: span 1; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0c0405; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px)">
<img src="{{n.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{n.pos}}">
</div>
</a>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2880}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: -1 };
}
renderVals() {
var self = this, op = this.state.open;
var SHOTS = [
{ title: 'EXTRACTION AT THE HELIPAD', place: 'HELIPAD · EXIT', img: 'assets/3ddec52c860b172d69222a7fc4ce5766.jpg', pos: '35% 50%', col: '3 / span 2', row: '1', align: 'start' },
{ title: 'THE SPECIMEN TANK', place: 'WARD B · CONTAINMENT', img: 'assets/46a9c08fe3ba5bc3adab7a72d510fb67.jpg', pos: '62% 42%', col: '5 / span 1', row: '1', align: 'start' },
{ title: 'THE HOLLOW CHOIR', place: 'HOSPITAL CHAPEL', img: 'assets/01929d7d6c470a755771ac8eb880a42e.jpg', pos: '50% 40%', col: '1 / span 2', row: '2', align: 'start' },
{ title: 'KAZI NIGHT PATROL', place: 'WARD B · PERIMETER', img: 'assets/b8fad39ccde2bba1e703bf60831b005f.jpg', pos: '50% 22%', col: '4 / span 1', row: '2', align: 'start' },
{ title: 'BREACHING LAB B-1', place: 'WARD B · LAB B-1', img: 'assets/2f9ea34f805d750b68576115ff35149d.jpg', pos: '62% 50%', col: '5 / span 2', row: '2', align: 'start' },
{ title: 'THE BUNKER', place: 'DEPLOY ROOM', img: 'assets/c6d05b18844288fc19e65301f3b92556.jpg', pos: '62% 50%', col: '1 / span 1', row: '3', align: 'start' },
{ title: 'IRON ANGEL’S COUNTER', place: 'THE BUNKER', img: 'assets/6cc3babce74769a487e63b555ec34faf.jpg', pos: '50% 30%', col: '3 / span 2', row: '3', align: 'start' },
{ title: 'FIRST PLAYTEST', place: 'BUILD 0.3', img: 'assets/ba6646f6b94c35414270d0c492495635.jpg', pos: '50% 65%', col: '6 / span 1', row: '3', align: 'end' }
];
var NEWS = [
{ date: '18 OCT 2026', tag: 'GIVEAWAY', title: '$5 STEAM GIFT CARD GIVEAWAY', text: 'Three winners. Follow @DeadSignalHQ, retweet and reply with #DEADSIGNAL. Ends 25 October.', img: 'assets/08440bdf718e925081aff7be6fce3f44.jpg', pos: '60% 45%' },
{ date: '18 OCT 2026', tag: 'DEVLOG', title: 'THE BUNKER GETS REBUILT', text: 'The deploy room, the hallway and the Storage room are being rebuilt from the concept sheets.', img: 'assets/c6d05b18844288fc19e65301f3b92556.jpg', pos: '62% 50%' },
{ date: '15 OCT 2026', tag: 'DEVLOG', title: 'YOU CAN PLAY AS A CLEANER', text: 'The Cleaners are now the player character on the main build, with modular gear.', img: 'assets/01e8f82193572386cd5b4ba97138ed94.jpg', pos: '50% 50%' },
{ date: '05 OCT 2026', tag: 'PLAYTEST', title: 'WHAT THE FIRST PLAYTEST CHANGED', text: 'Infection and bleeding effects are being redesigned, and an intel archive is on the way.', img: 'assets/ba6646f6b94c35414270d0c492495635.jpg', pos: '50% 65%' }
];
var pad = function (n) { return String(n).padStart(2, '0'); };
var n = SHOTS.length, c = SHOTS[op] || SHOTS[0];
var go = function (i) { self.setState({ open: (i + n) % n }); };
return {
count: pad(n),
shots: SHOTS.map(function (s, i) { return { title: s.title, img: s.img, pos: s.pos, col: s.col, row: s.row, align: s.align, num: pad(i + 1), open: function () { go(i); } }; }),
box: { open: op >= 0, title: c.title, place: c.place, img: c.img, pos: c.pos, num: pad(op + 1) },
prev: function () { go(op - 1); },
next: function () { go(op + 1); },
close: function () { self.setState({ open: -1 }); },
ctl: 'display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgb(229 48 58 / .6); color: #ece8e1; font-family: Share Tech Mono, ui-monospace, monospace; font-size: 18px; cursor: pointer',

};
}
}
</script>
</body>
</html>
